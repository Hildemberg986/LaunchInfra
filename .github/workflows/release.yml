name: Release Automatico

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: Analisa commits e calcula versão
  # ------------------------------------------------------------------
  bump:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
      skip: ${{ steps.bump.outputs.skip }}
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar GPG
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: BCE80ABE13055B48

      - id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" 2>/dev/null)
          if [ -z "$COMMITS" ]; then echo "skip=true" >> $GITHUB_OUTPUT; exit 0; fi
          MAJOR=0; MINOR=0; PATCH=0
          while IFS= read -r commit; do
            [[ "$commit" == Merge* ]] && continue
            if echo "$commit" | grep -qiE '^(feat|feature|add|adiciona)[^a-z]'; then MINOR=$((MINOR+1))
            elif echo "$commit" | grep -qiE '^(fix|bug|corrige|hotfix|resolve)[^a-z]'; then PATCH=$((PATCH+1))
            elif echo "$commit" | grep -qiE 'BREAKING CHANGE|breaking|major'; then MAJOR=$((MAJOR+1))
            else PATCH=$((PATCH+1)); fi
          done <<< "$COMMITS"
          [ "$MAJOR" -gt 0 ] && BUMP="major" || { [ "$MINOR" -gt 0 ] && BUMP="minor" || BUMP="patch"; }
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          CURRENT=$(grep '^VERSION' Makefile | awk '{print $3}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "new=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - if: steps.bump.outputs.skip != 'true'
        run: |
          sudo apt update && sudo apt install -y shellcheck
          shellcheck src/*.sh src/lib/*.sh || true

  # ------------------------------------------------------------------
  # Job 2: Build e publish para cada série (matrix strategy)
  # ------------------------------------------------------------------
  build-and-publish:
    needs: bump
    if: needs.bump.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        series: [noble, resolute, jammy, focal]
    outputs:
      version: ${{ needs.bump.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar GPG
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: BCE80ABE13055B48

      - name: "Atualizar versão no Makefile"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          sed -i "s/^VERSION = .*/VERSION = $NEW/" Makefile
          echo "✅ Makefile atualizado: VERSION = $NEW"

      - name: "Criar changelog para ${{ matrix.series }}"
        run: |
          SERIES="${{ matrix.series }}"
          NEW="${{ needs.bump.outputs.new }}"
          VERSION_WITH_SERIES="${NEW}~${SERIES}1"
          DATE=$(LC_TIME=C date -u +'%a, %d %b %Y %H:%M:%S +0000')

          # Criar changelog temporário apenas com a entrada para esta série
          TEMP=$(mktemp)
          printf "launchinfra (%s) %s; urgency=medium\n\n  * Release automatica v%s\n\n -- Hildemberg Eling <hildembergeling@gmail.com>  %s\n\n" \
            "$VERSION_WITH_SERIES" "$SERIES" "$NEW" "$DATE" > "$TEMP"

          # Adicionar changelog histórico (sem serie nos antigos)
          tail -n +$(grep -n "^launchinfra" debian/changelog | head -2 | tail -1 | cut -d: -f1) debian/changelog >> "$TEMP" 2>/dev/null || true

          mv "$TEMP" debian/changelog

          echo "✅ debian/changelog criado para $SERIES com versão $VERSION_WITH_SERIES"

      - name: "Instalar dependências"
        run: |
          sudo apt update && sudo apt install -y devscripts debhelper build-essential dput

      - name: "Build source e binário"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          SERIES="${{ matrix.series }}"
          VERSION_WITH_SERIES="${NEW}~${SERIES}1"

          make clean
          dpkg-buildpackage -S -sa -us -uc
          make build
          echo "📦 Arquivos gerados:"
          ls -la ../launchinfra_${VERSION_WITH_SERIES}* || ls -la ../launchinfra_*

      - name: "Garantir Distribution correta no .changes"
        run: |
          SERIES="${{ matrix.series }}"
          NEW="${{ needs.bump.outputs.new }}"
          VERSION_WITH_SERIES="${NEW}~${SERIES}1"

          if [ -f "../launchinfra_${VERSION_WITH_SERIES}_source.changes" ]; then
            sed -i "s/^Distribution: .*/Distribution: $SERIES/" \
              "../launchinfra_${VERSION_WITH_SERIES}_source.changes"
            echo "✅ Distribution: $SERIES aplicado"
          else
            echo "❌ .changes não encontrado!"
            ls -la ..
            exit 1
          fi

      - name: "Assinar pacote com GPG"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          SERIES="${{ matrix.series }}"
          VERSION_WITH_SERIES="${NEW}~${SERIES}1"

          if ! gpg --list-secret-keys BCE80ABE13055B48 2>/dev/null; then
            echo "❌ Chave GPG não encontrada!"
            exit 1
          fi
          if [ -n "${{ secrets.GPG_PASSPHRASE }}" ]; then
            debsign -k BCE80ABE13055B48 --passphrase="${{ secrets.GPG_PASSPHRASE }}" \
              ../launchinfra_${VERSION_WITH_SERIES}_source.changes
          else
            debsign -k BCE80ABE13055B48 ../launchinfra_${VERSION_WITH_SERIES}_source.changes
          fi
          echo "✅ Pacote assinado para $SERIES"

      - name: "Configurar dput"
        run: |
          mkdir -p ~/.dput.d/
          echo '[ppa:hildemberg986/launchinfra]' > ~/.dput.d/launchinfra.conf
          echo 'fqdn = ppa.launchpad.net' >> ~/.dput.d/launchinfra.conf
          echo 'method = ftp' >> ~/.dput.d/launchinfra.conf
          echo 'incoming = ~hildemberg986/launchinfra/ubuntu/' >> ~/.dput.d/launchinfra.conf
          echo 'login = anonymous' >> ~/.dput.d/launchinfra.conf
          echo 'allow_unsigned_uploads = 0' >> ~/.dput.d/launchinfra.conf
          echo "✅ launchinfra.conf criado"

      - name: "Publicar para ${{ matrix.series }}"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          SERIES="${{ matrix.series }}"
          VERSION_WITH_SERIES="${NEW}~${SERIES}1"

          if [ ! -f "../launchinfra_${VERSION_WITH_SERIES}_source.changes" ]; then
            echo "❌ Arquivo .changes não encontrado!"
            ls -la ..
            exit 1
          fi

          echo "📤 Enviando launchinfra ${VERSION_WITH_SERIES} para ${SERIES}..."
          dput ppa:hildemberg986/launchinfra "../launchinfra_${VERSION_WITH_SERIES}_source.changes"
          echo "✅ ${SERIES} publicado!"

      - name: "Salvar artefatos de sucesso"
        if: success()
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          SERIES="${{ matrix.series }}"
          VERSION_WITH_SERIES="${NEW}~${SERIES}1"

          mkdir -p artifacts
          cp ../launchinfra_${VERSION_WITH_SERIES}*.deb artifacts/ 2>/dev/null || true
          cp ../launchinfra_${VERSION_WITH_SERIES}_*.dsc artifacts/ 2>/dev/null || true
          cp ../launchinfra_${VERSION_WITH_SERIES}_*.tar.* artifacts/ 2>/dev/null || true
          echo "✅ Artefatos salvos"

      - name: "Upload artifacts"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: launchinfra-${{ needs.bump.outputs.new }}-${{ matrix.series }}
          path: artifacts/
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 3: Finalizar - commit, tag, release, gh-pages
  # ------------------------------------------------------------------
  finalize:
    needs: [bump, build-and-publish]
    if: needs.bump.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Atualizar versão no Makefile para commit"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          sed -i "s/^VERSION = .*/VERSION = $NEW/" Makefile
          echo "✅ Makefile atualizado: VERSION = $NEW"

      - name: "Criar changelog único para repositório"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          DATE=$(LC_TIME=C date -u +'%a, %d %b %Y %H:%M:%S +0000')

          # Changelog único (sem tilde, sem série específica) para o repositório
          TEMP=$(mktemp)
          printf "launchinfra (%s) UNRELEASED; urgency=medium\n\n  * Release automatica v%s\n\n -- Hildemberg Eling <hildembergeling@gmail.com>  %s\n\n" \
            "$NEW" "$NEW" "$DATE" > "$TEMP"

          tail -n +$(grep -n "^launchinfra" debian/changelog | head -1 | cut -d: -f1 | xargs -I {} expr {} + 1) debian/changelog >> "$TEMP" 2>/dev/null || true

          mv "$TEMP" debian/changelog
          echo "✅ debian/changelog criado para repositório"

      - name: "Commit versão no repo"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{github.repository}}.git"
          NEW="${{ needs.bump.outputs.new }}"

          git add Makefile debian/changelog
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump para v${NEW} [skip ci]"
            git push origin main
            echo "✅ Versão commitada: v${NEW}"
          else
            echo "✅ Nenhuma mudança para commitar"
          fi

      - name: "Criar tag"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{github.repository}}.git"
          NEW="${{ needs.bump.outputs.new }}"
          if ! git rev-parse "v${NEW}" >/dev/null 2>&1; then
            git tag -a "v${NEW}" -m "Release v${NEW}"
            git push origin "v${NEW}"
            echo "✅ Tag v${NEW} criada"
          else
            echo "✅ Tag v${NEW} já existe"
          fi

      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.new }}
          name: v${{ needs.bump.outputs.new }}
          files: |
            ./all-artifacts/*/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Atualizar gh-pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo

      - name: "Build gh-pages"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          mkdir -p new_repo/pool/main/l/launchinfra

          # Procurar o primeiro .deb encontrado
          DEB_FILE=$(find ./all-artifacts -name "launchinfra_*.deb" 2>/dev/null | head -1)
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" new_repo/pool/main/l/launchinfra/launchinfra.deb
            echo "✅ .deb copiado: $DEB_FILE"
          else
            echo "⚠️ .deb não encontrado, pulando gh-pages"
            exit 0
          fi

          if [ -d "repo/pool" ]; then cp -r repo/pool new_repo/ 2>/dev/null || true; fi

          cd new_repo
          mkdir -p dists/stable/main/binary-amd64
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9 dists/stable/main/binary-amd64/Packages
          RELEASE_DATE=$(date -Ru)
          printf 'Origin: LaunchInfra\nLabel: LaunchInfra\nSuite: stable\nCodename: stable\nArchitectures: amd64 all\nComponents: main\nDescription: LaunchInfra\nDate: %s\n' "$RELEASE_DATE" > dists/stable/Release
          apt-ftparchive release dists/stable >> dists/stable/Release

      - name: "Deploy gh-pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./new_repo
          publish_branch: gh-pages
          force_orphan: false
