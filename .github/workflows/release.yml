name: Release Automatico

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write

env:
  # Forçar uso de Node 24 para evitar warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: Analisa commits, calcula versão, atualiza changelog
  # ------------------------------------------------------------------
  bump:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
      skip: ${{ steps.bump.outputs.skip }}
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar GPG
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: BCE80ABE13055B48

      - id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" 2>/dev/null)
          if [ -z "$COMMITS" ]; then echo "skip=true" >> $GITHUB_OUTPUT; exit 0; fi
          MAJOR=0; MINOR=0; PATCH=0
          while IFS= read -r commit; do
            [[ "$commit" == Merge* ]] && continue
            if echo "$commit" | grep -qiE '^(feat|feature|add|adiciona)[^a-z]'; then MINOR=$((MINOR+1))
            elif echo "$commit" | grep -qiE '^(fix|bug|corrige|hotfix|resolve)[^a-z]'; then PATCH=$((PATCH+1))
            elif echo "$commit" | grep -qiE 'BREAKING CHANGE|breaking|major'; then MAJOR=$((MAJOR+1))
            else PATCH=$((PATCH+1)); fi
          done <<< "$COMMITS"
          [ "$MAJOR" -gt 0 ] && BUMP="major" || { [ "$MINOR" -gt 0 ] && BUMP="minor" || BUMP="patch"; }
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          CURRENT=$(grep '^VERSION' Makefile | awk '{print $3}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "new=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - if: steps.bump.outputs.skip != 'true'
        run: |
          sudo apt update && sudo apt install -y shellcheck
          shellcheck src/*.sh src/lib/*.sh || true

      - if: steps.bump.outputs.skip != 'true'
        name: "Validar changelog"
        run: |
          if ! head -1 debian/changelog | grep -q "noble\|focal\|jammy\|resolute"; then
            echo "⚠️ Changelog não tem série definida! Adicionando noble..."
            NEW="${{ steps.version.outputs.new }}"
            DATE=$(LC_TIME=C date -u +'%a, %d %b %Y %H:%M:%S +0000')
            sed -i "1i launchinfra ($NEW) noble; urgency=medium\n\n  * Release automatica v$NEW\n\n -- Hildemberg Eling <hildembergeling@gmail.com>  $DATE\n" debian/changelog
          fi

  # ------------------------------------------------------------------
  # Job 2: Build APENAS UMA VEZ (Ubuntu Noble)
  # ------------------------------------------------------------------
  build:
    needs: bump
    if: needs.bump.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.bump.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar GPG
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: BCE80ABE13055B48

      - name: "Atualizar versão no código"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          sed -i "s/^VERSION *=.*/VERSION = $NEW/" Makefile
          DATE=$(LC_TIME=C date -u +'%a, %d %b %Y %H:%M:%S +0000')
          TEMP=$(mktemp)
          printf "launchinfra (%s) noble; urgency=medium\n\n  * Release automatica v%s\n\n -- Hildemberg Eling <hildembergeling@gmail.com>  %s\n\n" \
            "$NEW" "$NEW" "$DATE" > "$TEMP"
          cat debian/changelog >> "$TEMP"
          mv "$TEMP" debian/changelog
          sed -i 's/echo "LaunchInfra v.*/echo "LaunchInfra v'"$NEW"'"/' src/lib/cli.sh

      - name: "Instalar dependências"
        run: |
          sudo apt update && sudo apt install -y devscripts debhelper build-essential dput

      - name: "Build source e binário"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          make clean
          dpkg-buildpackage -S -sa -us -uc
          make build
          echo "📦 Arquivos gerados:"
          ls -la ../launchinfra_${NEW}_*

      - name: "Garantir Distribution noble no .changes"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          if [ -f "../launchinfra_${NEW}_source.changes" ]; then
            sed -i "s/^Distribution: .*/Distribution: noble/" \
              "../launchinfra_${NEW}_source.changes"
            echo "✅ Distribution: noble aplicado"
          else
            echo "❌ .changes não encontrado!"
            ls -la ..
            exit 1
          fi

      - name: "Assinar pacote com GPG"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          if ! gpg --list-secret-keys BCE80ABE13055B48 2>/dev/null; then
            echo "❌ Chave GPG não encontrada!"
            exit 1
          fi
          if [ -n "${{ secrets.GPG_PASSPHRASE }}" ]; then
            debsign -k BCE80ABE13055B48 --passphrase="${{ secrets.GPG_PASSPHRASE }}" \
              ../launchinfra_${NEW}_source.changes
          else
            debsign -k BCE80ABE13055B48 ../launchinfra_${NEW}_source.changes
          fi
          echo "✅ Pacote assinado"

      - name: "Configurar dput"
        run: |
          mkdir -p ~/.dput.d/
          echo '[ppa:hildemberg986/launchinfra]' > ~/.dput.d/launchinfra.conf
          echo 'fqdn = ppa.launchpad.net' >> ~/.dput.d/launchinfra.conf
          echo 'method = ftp' >> ~/.dput.d/launchinfra.conf
          echo 'incoming = ~hildemberg986/launchinfra/ubuntu/' >> ~/.dput.d/launchinfra.conf
          echo 'login = anonymous' >> ~/.dput.d/launchinfra.conf
          echo 'allow_unsigned_uploads = 0' >> ~/.dput.d/launchinfra.conf

      - name: "Copiar arquivos para o diretório atual com fallback"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          echo "🔍 Procurando arquivos para copiar..."

          # Tentativa 1: Copiar com wildcard
          if cp ../launchinfra_${NEW}* . 2>/dev/null; then
            echo "✅ Arquivos copiados com sucesso (wildcard)"
          else
            echo "⚠️ Wildcard falhou, tentando copiar arquivos específicos..."
            
            # Tentativa 2: Copiar arquivos específicos
            for file in ../launchinfra_${NEW}_source.changes ../launchinfra_${NEW}_*.dsc ../launchinfra_${NEW}_*.tar.* ../launchinfra_${NEW}_*.deb; do
              if [ -f "$file" ]; then
                cp "$file" . && echo "✅ Copiado: $(basename $file)"
              fi
            done
          fi

          # Sempre copiar o dput.conf
          cp ~/.dput.d/launchinfra.conf .

          echo "📁 Arquivos no diretório atual:"
          ls -la

      - name: "Verificar arquivos antes do upload"
        run: |
          echo "🔍 Verificando arquivos necessários..."
          MISSING=0

          for file in launchinfra_*.changes launchinfra_*.dsc launchinfra_*.tar.*; do
            if [ -f "$file" ]; then
              echo "✅ $file encontrado"
            else
              echo "❌ $file não encontrado!"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "⚠️ Alguns arquivos estão faltando, mas continuando..."
          fi

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: launchinfra-${{ needs.bump.outputs.new }}
          path: |
            launchinfra_${{ needs.bump.outputs.new }}*
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 3: Publicar para Noble (com verificações)
  # ------------------------------------------------------------------
  publish-noble:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launchinfra-${{ needs.bump.outputs.new }}
          path: ./artifacts

      - name: "Verificar artefatos baixados"
        run: |
          echo "🔍 Verificando artefatos..."
          ls -la ./artifacts/
          if [ -z "$(ls -A ./artifacts/)" ]; then
            echo "❌ Nenhum artefato encontrado!"
            exit 1
          fi
          echo "✅ Artefatos encontrados"

      - name: "Instalar dput e configurar GPG"
        run: |
          sudo apt update
          sudo apt install -y dput

          # Importar chave pública via keyserver com fallback
          echo "🔑 Importando chave GPG..."
          if gpg --keyserver keyserver.ubuntu.com --recv-keys BCE80ABE13055B48; then
            echo "✅ Chave importada do keyserver"
          else
            echo "⚠️ Falha no keyserver, tentando com hkp..."
            gpg --keyserver hkp://keyserver.ubuntu.com --recv-keys BCE80ABE13055B48 || true
          fi

      - name: "Enviar para PPA noble"
        run: |
          mkdir -p ~/.dput.d/
          cp ./artifacts/launchinfra.conf ~/.dput.d/launchinfra.conf
          cd ./artifacts
          NEW="${{ needs.bump.outputs.new }}"

          # Verificar se o .changes existe
          if [ ! -f "launchinfra_${NEW}_source.changes" ]; then
            echo "❌ Arquivo .changes não encontrado!"
            ls -la
            exit 1
          fi

          echo "📤 Enviando launchinfra ${NEW} para noble..."
          dput ppa:hildemberg986/launchinfra launchinfra_${NEW}_source.changes
          echo "✅ Noble publicado!"

  # ------------------------------------------------------------------
  # Job 4: Publicar para outras séries (com verificações)
  # ------------------------------------------------------------------
  publish-other-series:
    needs: [bump, publish-noble]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        series: [focal, jammy, resolute]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launchinfra-${{ needs.bump.outputs.new }}
          path: ./artifacts

      - name: "Verificar artefatos baixados"
        run: |
          echo "🔍 Verificando artefatos..."
          ls -la ./artifacts/
          if [ -z "$(ls -A ./artifacts/)" ]; then
            echo "❌ Nenhum artefato encontrado!"
            exit 1
          fi
          echo "✅ Artefatos encontrados"

      - name: "Instalar dput e configurar GPG"
        run: |
          sudo apt update
          sudo apt install -y dput

          echo "🔑 Importando chave GPG..."
          if gpg --keyserver keyserver.ubuntu.com --recv-keys BCE80ABE13055B48; then
            echo "✅ Chave importada do keyserver"
          else
            echo "⚠️ Falha no keyserver, tentando com hkp..."
            gpg --keyserver hkp://keyserver.ubuntu.com --recv-keys BCE80ABE13055B48 || true
          fi

      - name: "Configurar dput"
        run: |
          mkdir -p ~/.dput.d/
          cp ./artifacts/launchinfra.conf ~/.dput.d/launchinfra.conf

      - name: "Preparar arquivos para ${{ matrix.series }}"
        run: |
          cd ./artifacts
          SERIES="${{ matrix.series }}"
          NEW="${{ needs.bump.outputs.new }}"
          NEW_VERSION="${NEW}-0${SERIES}1"

          echo "🔄 Convertendo para $SERIES (versão: $NEW_VERSION)"

          # Verificar se os arquivos existem
          if [ ! -f "launchinfra_${NEW}_source.changes" ]; then
            echo "❌ Arquivo .changes não encontrado!"
            ls -la
            exit 1
          fi

          # Copiar arquivos com nova versão
          for file in launchinfra_${NEW}_*; do
            if [ -f "$file" ]; then
              NEW_FILE="${file/${NEW}/${NEW_VERSION}}"
              cp "$file" "$NEW_FILE"
              echo "✅ Copiado: $file → $NEW_FILE"
            fi
          done

          # Atualizar .changes
          sed -i "s/^Version: .*/Version: $NEW_VERSION/" launchinfra_${NEW_VERSION}_source.changes
          sed -i "s/^Distribution: .*/Distribution: $SERIES/" launchinfra_${NEW_VERSION}_source.changes

          # Atualizar .dsc se existir
          if [ -f "launchinfra_${NEW_VERSION}.dsc" ]; then
            sed -i "s/^Version: .*/Version: $NEW_VERSION/" launchinfra_${NEW_VERSION}.dsc
          fi

          echo "✅ Distribution alterado para $SERIES"

      - name: "Re-assinar pacote para ${{ matrix.series }}"
        run: |
          cd ./artifacts
          SERIES="${{ matrix.series }}"
          NEW="${{ needs.bump.outputs.new }}"
          NEW_VERSION="${NEW}-0${SERIES}1"

          # Verificar chave GPG
          if ! gpg --list-secret-keys BCE80ABE13055B48 2>/dev/null; then
            echo "❌ Chave GPG não encontrada!"
            exit 1
          fi

          # Verificar se o .changes existe
          if [ ! -f "launchinfra_${NEW_VERSION}_source.changes" ]; then
            echo "❌ Arquivo .changes não encontrado!"
            ls -la
            exit 1
          fi

          echo "🔐 Re-assinando para $SERIES..."
          if [ -n "${{ secrets.GPG_PASSPHRASE }}" ]; then
            debsign -k BCE80ABE13055B48 --passphrase="${{ secrets.GPG_PASSPHRASE }}" \
              launchinfra_${NEW_VERSION}_source.changes
          else
            debsign -k BCE80ABE13055B48 launchinfra_${NEW_VERSION}_source.changes
          fi
          echo "✅ Re-assinado para $SERIES"

      - name: "Upload para PPA ${{ matrix.series }}"
        run: |
          cd ./artifacts
          SERIES="${{ matrix.series }}"
          NEW="${{ needs.bump.outputs.new }}"
          NEW_VERSION="${NEW}-0${SERIES}1"

          echo "📤 Enviando launchinfra ${NEW_VERSION} para ${SERIES}..."
          dput ppa:hildemberg986/launchinfra launchinfra_${NEW_VERSION}_source.changes
          echo "✅ ${SERIES} publicado!"

  # ------------------------------------------------------------------
  # Job 5: Finalizar (com verificações)
  # ------------------------------------------------------------------
  finalize:
    needs: [bump, build, publish-noble, publish-other-series]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: launchinfra-${{ needs.bump.outputs.new }}
          path: ./artifacts

      - name: "Verificar artefatos"
        run: |
          echo "🔍 Verificando artefatos para finalização..."
          ls -la ./artifacts/
          if [ -z "$(ls -A ./artifacts/)" ]; then
            echo "⚠️ Nenhum artefato encontrado para finalização"
          else
            echo "✅ Artefatos encontrados"
          fi

      - name: "Commit versão no repo"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{github.repository}}.git"
          NEW="${{ needs.bump.outputs.new }}"

          git add Makefile debian/changelog src/lib/cli.sh
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump para v${NEW} [skip ci]"
            git push origin main
          else
            echo "✅ Nenhuma mudança para commitar"
          fi

      - name: "Criar tag"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{github.repository}}.git"
          NEW="${{ needs.bump.outputs.new }}"
          if ! git rev-parse "v${NEW}" >/dev/null 2>&1; then
            git tag -a "v${NEW}" -m "Release v${NEW}"
            git push origin "v${NEW}"
          else
            echo "✅ Tag v${NEW} já existe"
          fi

      - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.new }}
          name: v${{ needs.bump.outputs.new }}
          files: ./artifacts/launchinfra_${{ needs.bump.outputs.new }}*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Atualizar gh-pages"
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo

      - name: "Build gh-pages"
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          mkdir -p new_repo/pool/main/l/launchinfra

          # Procurar o .deb com wildcard
          DEB_FILE=$(ls ./artifacts/launchinfra_${NEW}_*.deb 2>/dev/null | head -1)
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" new_repo/pool/main/l/launchinfra/launchinfra.deb
            echo "✅ .deb copiado: $DEB_FILE"
          else
            echo "⚠️ .deb não encontrado, pulando gh-pages"
            exit 0
          fi

          if [ -d "repo/pool" ]; then cp -r repo/pool new_repo/ 2>/dev/null || true; fi

          cd new_repo
          mkdir -p dists/stable/main/binary-amd64
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9 dists/stable/main/binary-amd64/Packages
          RELEASE_DATE=$(date -Ru)
          printf 'Origin: LaunchInfra\nLabel: LaunchInfra\nSuite: stable\nCodename: stable\nArchitectures: amd64 all\nComponents: main\nDescription: LaunchInfra\nDate: %s\n' "$RELEASE_DATE" > dists/stable/Release
          apt-ftparchive release dists/stable >> dists/stable/Release

      - name: "Deploy gh-pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./new_repo
          publish_branch: gh-pages
          force_orphan: false
