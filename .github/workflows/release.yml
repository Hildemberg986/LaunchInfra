name: Release Automatico

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: Analisa commits, calcula versão, valida sintaxe
  # ------------------------------------------------------------------
  bump:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
      skip: ${{ steps.bump.outputs.skip }}
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar GPG
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: BCE80ABE13055B48

      - name: Debug GPG - Verificar chave importada
        run: |
          echo "🔍 Listando chaves GPG importadas..."
          gpg --list-secret-keys --keyid-format LONG || true
          echo ""
          echo "🔍 Procurando pela chave BCE80ABE13055B48..."
          if gpg --list-secret-keys BCE80ABE13055B48 2>/dev/null; then
            echo "✅ Chave GPG encontrada com sucesso!"
          else
            echo "❌ Chave GPG NÃO encontrada!"
            echo "Verifique se GPG_PRIVATE_KEY esta configurado."
            exit 1
          fi

      - id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" 2>/dev/null)
          if [ -z "$COMMITS" ]; then echo "skip=true" >> $GITHUB_OUTPUT; exit 0; fi
          MAJOR=0; MINOR=0; PATCH=0
          while IFS= read -r commit; do
            [[ "$commit" == Merge* ]] && continue
            if echo "$commit" | grep -qiE '^(feat|feature|add|adiciona)[^a-z]'; then MINOR=$((MINOR+1))
            elif echo "$commit" | grep -qiE '^(fix|bug|corrige|hotfix|resolve)[^a-z]'; then PATCH=$((PATCH+1))
            elif echo "$commit" | grep -qiE 'BREAKING CHANGE|breaking|major'; then MAJOR=$((MAJOR+1))
            else PATCH=$((PATCH+1)); fi
          done <<< "$COMMITS"
          [ "$MAJOR" -gt 0 ] && BUMP="major" || { [ "$MINOR" -gt 0 ] && BUMP="minor" || BUMP="patch"; }
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          CURRENT=$(grep '^VERSION' Makefile | awk '{print $3}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "new=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - if: steps.bump.outputs.skip != 'true'
        run: |
          sudo apt update && sudo apt install -y shellcheck
          shellcheck src/*.sh src/lib/*.sh

  # ------------------------------------------------------------------
  # Job 2: Build + publish para cada série Ubuntu LTS
  # ------------------------------------------------------------------
  release:
    needs: bump
    if: needs.bump.outputs.skip != 'true'
    runs-on: ubuntu-${{ matrix.series }}
    strategy:
      fail-fast: false
      matrix:
        # Lista de séries LTS suportadas
        series: [focal, jammy, noble, resolute]
    env:
      NEW: ${{ needs.bump.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar GPG
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: BCE80ABE13055B48

      - name: Atualizar versão no código
        run: |
          # Detectar codename do runner para usar no changelog
          DIST=$(. /etc/os-release && echo "$UBUNTU_CODENAME")
          echo "🎯 Série alvo: $DIST"
          CURRENT_SERIES="${{ matrix.series }}"

          # Se o runner é uma serie diferente do matrix target, forçar a serie matrix
          # O GitHub Actions ubuntu-XX.04 usa codename real, então matrix.series
          # é igual a UBUNTU_CODENAME na maioria dos casos
          echo "✅ Usando serie: $CURRENT_SERIES"

          # Atualizar Makefile
          sed -i "s/^VERSION *=.*/VERSION = $NEW/" Makefile

          # Atualizar changelog com a serie correta
          TEMP=$(mktemp)
          DATE=$(LC_TIME=C date -u +'%a, %d %b %Y %H:%M:%S +0000')
          printf "launchinfra (%s) %s; urgency=medium\n\n  * Release automatica v%s\n\n -- Hildemberg Eling <hildembergeling@gmail.com>  %s\n\n" \
            "$NEW" "$CURRENT_SERIES" "$NEW" "$DATE" > "$TEMP"
          cat debian/changelog >> "$TEMP"
          mv "$TEMP" debian/changelog

          # Atualizar versao em cli.sh
          sed -i 's/echo "LaunchInfra v.*/echo "LaunchInfra v'"$NEW"'"/' src/lib/cli.sh

      - name: Instalar dependencias
        run: |
          sudo apt update && sudo apt install -y devscripts debhelper build-essential dput

      - name: Build source package
        run: |
          make clean
          dpkg-buildpackage -S -sa -us -uc
          make build
          echo "📦 Arquivos gerados:"
          ls -la ../launchinfra_${NEW}_* 2>/dev/null

      - name: Garantir Distribution correto no .changes
        run: |
          CURRENT_SERIES="${{ matrix.series }}"
          if [ -f "../launchinfra_${NEW}_source.changes" ]; then
            sed -i "s/^Distribution: .*/Distribution: $CURRENT_SERIES/" \
              "../launchinfra_${NEW}_source.changes"
            echo "✅ Distribution: $CURRENT_SERIES aplicado ao .changes"
            echo "Conteudo do .changes:"
            cat "../launchinfra_${NEW}_source.changes" | head -15
          else
            echo "❌ .changes nao encontrado!"
            exit 1
          fi

      - name: Assinar pacote com GPG
        run: |
          # Verificar chave
          if ! gpg --list-secret-keys BCE80ABE13055B48 2>/dev/null; then
            echo "❌ Chave GPG nao encontrada!"
            exit 1
          fi

          # Assinar
          if [ -n "${{ secrets.GPG_PASSPHRASE }}" ]; then
            echo "🔐 Assinando com passphrase..."
            debsign -k BCE80ABE13055B48 --passphrase="${{ secrets.GPG_PASSPHRASE }}" \
              ../launchinfra_${NEW}_source.changes
          else
            echo "🔐 Assinando sem passphrase..."
            debsign -k BCE80ABE13055B48 ../launchinfra_${NEW}_source.changes
          fi
          echo "✅ Assinatura concluida!"

      - name: Configurar dput
        run: |
          mkdir -p ~/.dput.d/
          echo '[ppa:hildemberg986/launchinfra]' > ~/.dput.d/launchinfra.conf
          echo 'fqdn = ppa.launchpad.net' >> ~/.dput.d/launchinfra.conf
          echo 'method = ftp' >> ~/.dput.d/launchinfra.conf
          echo 'incoming = ~hildemberg986/launchinfra/ubuntu/' >> ~/.dput.d/launchinfra.conf
          echo 'login = anonymous' >> ~/.dput.d/launchinfra.conf
          echo 'allow_unsigned_uploads = 0' >> ~/.dput.d/launchinfra.conf
          echo "📄 Configuracao do dput:"
          cat ~/.dput.d/launchinfra.conf

      - name: Enviar para PPA
        run: |
          echo "📤 Enviando para PPA (${{ matrix.series }})..."
          dput ppa:hildemberg986/launchinfra ../launchinfra_${{ needs.bump.outputs.new }}_source.changes

          # Upload
          echo "📤 Enviando para PPA (${{ matrix.series }})..."
          dput ppa:hildemberg986/launchinfra ../launchinfra_${NEW}_source.changes

      - name: Notificar sucesso
        run: |
          echo "🎉 Build e publish para ${{ matrix.series }} concluidos com sucesso!"
          echo "📦 launchinfra $NEW publicado em ppa:hildemberg986/launchinfra para serie ${{ matrix.series }}"

  # ------------------------------------------------------------------
  # Job 3: Commit versao + GitHub Release + gh-pages
  # ------------------------------------------------------------------
  release-commit:
    needs: [bump, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit versao no repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{github.repository}}.git"

          # Atualizar Makefile (versao ja foi feita no job release)
          NEW="${{ needs.bump.outputs.new }}"
          echo "VERSION = $NEW" > Makefile.tmp
          # Preservar targets do Makefile
          grep -v "^VERSION" Makefile >> Makefile.tmp
          mv Makefile.tmp Makefile

          git add Makefile src/lib/cli.sh
          git commit -m "chore: bump para v${NEW}" || true
          git push origin main

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.new }}
          name: v${{ needs.bump.outputs.new }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo

      - name: Build gh-pages
        run: |
          NEW="${{ needs.bump.outputs.new }}"
          mkdir -p new_repo/pool/main/l/launchinfra
          # Baixar .deb buildado na matrix (usar noble como referencia)
          # Ou rebuild simples para gh-pages
          sudo apt update && sudo apt install -y debhelper
          cd /home/runner/work/LaunchInfra/LaunchInfra
          # Build simples pra gh-pages
          make clean && make build
          cp ../launchinfra_${NEW}_all.deb new_repo/pool/main/l/launchinfra/
          if [ -d "repo/pool" ]; then cp -r repo/pool new_repo/ 2>/dev/null || true; fi

          cd new_repo
          mkdir -p dists/stable/main/binary-amd64
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9 dists/stable/main/binary-amd64/Packages
          RELEASE_DATE=$(date -Ru)
          printf 'Origin: LaunchInfra\nLabel: LaunchInfra\nSuite: stable\nCodename: stable\nArchitectures: amd64 all\nComponents: main\nDescription: LaunchInfra\nDate: %s\n' "$RELEASE_DATE" > dists/stable/Release
          apt-ftparchive release dists/stable >> dists/stable/Release

      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./new_repo
          publish_branch: gh-pages
          force_orphan: false
