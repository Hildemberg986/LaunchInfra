name: Release Automático

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Importar GPG
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"%s" 2>/dev/null)
          NEW_VERSION=$(grep '^VERSION' Makefile | awk '{print $3}')
          if [ -z "$COMMITS" ]; then
            # No new commits since last tag - check if release already exists
            if gh release view "v$NEW_VERSION" >/dev/null 2>&1; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            # Release doesn't exist yet - force it
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - if: steps.bump.outputs.skip != 'true'
        run: |
          sudo apt update && sudo apt install -y shellcheck
          shellcheck src/*.sh src/lib/*.sh

      - if: steps.bump.outputs.skip != 'true'
        run: |
          # Use the version already set in Makefile (not calculated)
          NEW=$(grep '^VERSION' Makefile | awk '{print $3}')
          DATE=$(LC_TIME=C date -u +'%a, %d %b %Y %H:%M:%S +0000')
          TEMP=$(mktemp)
          printf "launchinfra (%s) noble; urgency=medium\n\n  * Release automatica v%s\n\n -- Hildemberg Eling <hildembergeling@gmail.com>  %s\n\n" "$NEW" "$NEW" "$DATE" > "$TEMP"
          cat debian/changelog >> "$TEMP"
          mv "$TEMP" debian/changelog
          sed -i 's/echo "LaunchInfra v.*/echo "LaunchInfra v'"$NEW"'"/' src/lib/cli.sh

      - if: steps.bump.outputs.skip != 'true'
        run: |
          sudo apt update && sudo apt install -y devscripts debhelper build-essential dput
          make clean
          dpkg-buildpackage -S -sa -us -uc
          make build

      - if: steps.bump.outputs.skip != 'true'
        run: |
          NEW=$(grep '^VERSION' Makefile | awk '{print $3}')
          debsign -k BCE80ABE13055B48 ../launchinfra_${NEW}_source.changes
          dput ppa:hildemberg986/launchinfra ../launchinfra_${NEW}_source.changes

      - if: steps.bump.outputs.skip != 'true'
        run: |
          NEW=$(grep '^VERSION' Makefile | awk '{print $3}')
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add Makefile debian/changelog src/lib/cli.sh
          git commit -m "chore: bump para v${NEW} [skip ci]" || true
          git push origin main

      - if: steps.bump.outputs.skip != 'true'
        run: |
          NEW=$(grep '^VERSION' Makefile | awk '{print $3}')
          echo "new=$NEW" >> $GITHUB_OUTPUT
        id: version

      - if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          files: ../launchinfra_${{ steps.version.outputs.new }}_all.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.bump.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo

      - if: steps.bump.outputs.skip != 'true'
        run: |
          NEW=$(grep '^VERSION' Makefile | awk '{print $3}')
          mkdir -p new_repo/pool/main/l/launchinfra
          cp ../launchinfra_${NEW}_all.deb new_repo/pool/main/l/launchinfra/launchinfra.deb
          if [ -d "repo/pool" ]; then cp -r repo/pool new_repo/ 2>/dev/null || true; fi

      - if: steps.bump.outputs.skip != 'true'
        run: |
          cd new_repo
          mkdir -p dists/stable/main/binary-amd64
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9 dists/stable/main/binary-amd64/Packages
          RELEASE_DATE=$(date -Ru)
          printf 'Origin: LaunchInfra\nLabel: LaunchInfra\nSuite: stable\nCodename: stable\nArchitectures: amd64 all\nComponents: main\nDescription: LaunchInfra\nDate: %s\n' "$RELEASE_DATE" > dists/stable/Release
          apt-ftparchive release dists/stable >> dists/stable/Release

      - if: steps.bump.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./new_repo
          publish_branch: gh-pages
          force_orphan: false
